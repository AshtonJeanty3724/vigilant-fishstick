<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: #00eaff;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

.jarvis-container {
    width: 100vw;
    height: 100vh;
    background:
        radial-gradient(circle at center, #071c22 0%, #020708 35%, #000 75%);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
}

/* TOP */

.top {
    width: 100%;
    padding: 20px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 6px;
    text-shadow: 0 0 15px #00eaff;
}

.system {
    font-size: 13px;
    letter-spacing: 3px;
    color: #00ff9d;
}

/* CLOCK */

.clock-area {
    text-align: center;
    margin-top: 5px;
}

#clock {
    font-size: 38px;
    font-weight: bold;
    text-shadow: 0 0 15px #00eaff;
}

#date {
    color: #8aefff;
    font-size: 14px;
    margin-top: 5px;
}

/* MAIN REACTOR */

.reactor-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    width: 100%;
}

.reactor {
    width: 250px;
    height: 250px;
    border-radius: 50%;
    border: 3px solid #00eaff;
    box-shadow:
        0 0 20px #00eaff,
        0 0 50px rgba(0,234,255,.5),
        inset 0 0 35px rgba(0,234,255,.4);
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    transition: .3s;
}

.reactor::before,
.reactor::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    border: 1px solid #00eaff;
}

.reactor::before {
    width: 190px;
    height: 190px;
}

.reactor::after {
    width: 125px;
    height: 125px;
}

.reactor-core {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: #00eaff;
    box-shadow:
        0 0 20px #00eaff,
        0 0 50px #00eaff;
    z-index: 2;
}

/* LISTENING ANIMATION */

.reactor.listening {
    animation: pulse 1s infinite;
    border-color: #00ff9d;
    box-shadow:
        0 0 25px #00ff9d,
        0 0 60px rgba(0,255,157,.6),
        inset 0 0 40px rgba(0,255,157,.4);
}

.reactor.listening .reactor-core {
    background: #00ff9d;
    box-shadow:
        0 0 25px #00ff9d,
        0 0 60px #00ff9d;
}

@keyframes pulse {
    0%,100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.08);
    }
}

/* TEXT */

#statusDisplay {
    margin-top: 30px;
    font-size: 15px;
    letter-spacing: 4px;
    color: #00ff9d;
}

#you {
    margin-top: 20px;
    color: #7eeeff;
    max-width: 700px;
    text-align: center;
    min-height: 22px;
}

#jarvis {
    margin-top: 12px;
    color: white;
    max-width: 700px;
    text-align: center;
    min-height: 28px;
    font-size: 18px;
}

/* MIC */

#micButton {
    margin-top: 30px;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 2px solid #00eaff;
    background: #001014;
    color: #00eaff;
    font-size: 32px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(0,234,255,.6);
    transition: .2s;
}

#micButton:hover {
    transform: scale(1.08);
    box-shadow: 0 0 35px #00eaff;
}

#micButton:active {
    transform: scale(.95);
}

/* BOTTOM */

.bottom {
    width: 100%;
    padding: 15px 25px;
    display: flex;
    justify-content: space-between;
    color: #3fd9e8;
    font-size: 12px;
    letter-spacing: 2px;
}

#stopwatch {
    color: #00ff9d;
}

/* MOBILE */

@media(max-width:600px) {

    .reactor {
        width: 200px;
        height: 200px;
    }

    .reactor::before {
        width: 150px;
        height: 150px;
    }

    .reactor::after {
        width: 100px;
        height: 100px;
    }

    #clock {
        font-size: 30px;
    }

    .logo {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<div class="jarvis-container">

    <div class="top">
        <div class="logo">J.A.R.V.I.S.</div>
        <div class="system">SYSTEM ONLINE</div>
    </div>

    <div class="clock-area">
        <div id="clock">--:--:--</div>
        <div id="date">Loading...</div>
    </div>

    <div class="reactor-area">

        <div id="reactor" class="reactor">
            <div class="reactor-core"></div>
        </div>

        <div id="statusDisplay">
            PRESS MIC TO START
        </div>

        <div id="you">
            You: ...
        </div>

        <div id="jarvis">
            Press the microphone and say "Jarvis".
        </div>

        <button id="micButton" title="Talk to JARVIS">
            🎙
        </button>

    </div>

    <div class="bottom">
        <div>J.A.R.V.I.S. v1</div>
        <div id="stopwatch">00:00</div>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
